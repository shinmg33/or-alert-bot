name: Build Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'or_alert/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'run.py'
      - 'build.ps1'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and build
        shell: pwsh
        run: ./build.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AlertBot-0.7.2-windows-x64
          path: dist/AlertBot-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
